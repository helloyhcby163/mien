plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    // :targets 只是 targets/fabric-1.21.1 等项目的中间容器，本身没有构建内容。
    if (project.name == 'targets') {
        return
    }

    apply plugin: 'java'
    apply plugin: 'maven-publish'

    repositories {
        maven { url = "https://neoforged.forgecdn.net/releases" }
        maven { url = "https://neoforged.forgecdn.net/mojang-meta" }
        maven { url = "https://libraries.minecraft.net/" }
        maven { url = "https://maven.fastmirror.net/repositories/minecraft/" }
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
